name: Diagnose macOS readiness
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Trace Python HTTP server startup
        run: |
          python3 -u - <<'PYTHON' > /tmp/python-server.log 2>&1 &
          import time
          print('starting', time.time(), flush=True)
          import http.server
          print('imported http.server', time.time(), flush=True)
          import socket
          print('fqdn', socket.getfqdn('127.0.0.1'), time.time(), flush=True)
          server = http.server.HTTPServer(('127.0.0.1', 45678), http.server.SimpleHTTPRequestHandler)
          print('bound', time.time(), flush=True)
          server.serve_forever()
          PYTHON
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          cat /tmp/python-server.log
          curl --max-time 5 -v http://127.0.0.1:45678/ || true
          ps -p "$server_pid" -o pid,etime,command
          sample "$server_pid" 2 -file /tmp/python-sample.txt || true
          cat /tmp/python-server.log
          sed -n '1,110p' /tmp/python-sample.txt

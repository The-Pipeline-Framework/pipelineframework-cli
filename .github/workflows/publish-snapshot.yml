name: Publish Maven Central Snapshot

on:
  schedule:
    # After runtime's nightly snapshot slot; cron is UTC, not a dependency gate.
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-central-snapshot-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check publication authority
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Snapshots publish only from main'; exit 1; }
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            test -n "${!name}" || { echo "Missing publication secret: $name"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Verify snapshot publication contract
        run: |
          python3 scripts/test-publication-config.py
          VERSION="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository")"
          case "$VERSION" in *-SNAPSHOT) ;; *) echo 'Snapshot version required'; exit 1;; esac
      - name: Verify and publish canonical reactor
        run: ./mvnw -B clean deploy -Pcentral-publishing -U --no-transfer-progress -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
